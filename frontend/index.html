<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <title>打字练习软件</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== 顶部导航栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⌨️</span>
      <span class="brand-text">打字练习软件</span>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-view="practice">英语练习</button>
      <button class="nav-btn" data-view="zh">汉语练习</button>
      <button class="nav-btn" data-view="coder">程序员练习</button>
      <button class="nav-btn" data-view="speed">速度测试</button>
      <button class="nav-btn" data-view="weak-point">🎯 弱项特训</button>
      <button class="nav-btn" data-view="records">成绩记录</button>
      <button class="nav-btn theme-btn" id="theme-toggle" title="切换主题">🌙</button>
    </nav>
  </header>

  <!-- ===== 页面内容区 ===== -->
  <main id="app">

    <!-- 英语练习页（键位指法模块挂载区） -->
    <section class="view active" id="view-practice">
      <div class="view-header">
        <h1>英文练习</h1>
        <p class="view-desc">标准指法渐进课程，从基准键学起，逐级掌握全部键位</p>
      </div>
      <div id="finger-training"></div>
    </section>

    <!-- 汉语练习页（入口菜单 + 拼音/五笔子视图） -->
    <section class="view" id="view-zh">
      <div id="zh-home"></div>
    </section>

    <!-- 程序员练习页 -->
    <section class="view" id="view-coder">
      <div class="view-header">
        <h1>程序员练习</h1>
        <p class="view-desc">编程符号与代码段指法训练，掌握 Shift 组合键位</p>
      </div>
      <div id="coder-training"></div>
    </section>

    <!-- 速度测试页 -->
    <section class="view" id="view-speed">
      <div id="speed-test"></div>
    </section>

    <!-- 弱项特训页 -->
    <section class="view" id="view-weak-point">
      <div id="weak-point"></div>
    </section>

    <!-- 成绩记录页 -->
    <section class="view" id="view-records">
      <div id="records"></div>
    </section>

  </main>

  <script src="en/finger-lessons.js"></script>
  <script src="en/articles.js"></script>
  <script src="en/coder-lessons.js"></script>
  <script src="code/code-snippets.js"></script>
  <script src="js/fingerTraining.js"></script>
  <script src="js/coderTyping.js"></script>
  <script src="js/speedTest.js"></script>
  <script src="js/weakPointTraining.js"></script>
  <script src="js/records.js"></script>
  <script src="zh/articles.js"></script>
  <script src="zh/wubiDict.js"></script>
  <script src="zh/pinyinTyping.js"></script>
  <script src="zh/wubiTyping.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
