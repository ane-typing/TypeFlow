name: Build Windows

# 打 tag（如 v0.2.0）或手动触发时，自动用 electron-builder 打包 Windows 安装包并创建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer + portable
        # win.target 配置为 nsis + portable，一次构建产出两个 exe：
        #   打字练习软件 Setup <版本>.exe（安装版）与 打字练习软件 <版本>.exe（便携版）
        # --publish never：禁止 electron-builder 的隐式发布（它需要 GH_TOKEN），
        #   改由下方 softprops/action-gh-release 用系统注入的 GITHUB_TOKEN 创建 Release。
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.blockmap
